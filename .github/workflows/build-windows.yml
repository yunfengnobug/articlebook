name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Test archive engine
        run: cargo test -p articlebook-engine --locked

      - name: Build Windows installer
        shell: pwsh
        env:
          # Used only when signing/articlebook.key is missing. Do not set a password:
          # the key has none, and CI makes Tauri treat a missing password as empty.
          TAURI_SIGNING_PRIVATE_KEY_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $keyPath = Join-Path $env:GITHUB_WORKSPACE "signing\articlebook.key"
          if (Test-Path -LiteralPath $keyPath) {
            $env:TAURI_SIGNING_PRIVATE_KEY = $keyPath
            Write-Host "Using committed signing key: signing/articlebook.key"
          } elseif (-not [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_SECRET)) {
            $env:TAURI_SIGNING_PRIVATE_KEY = $env:TAURI_SIGNING_PRIVATE_KEY_SECRET
            Write-Host "Committed signing key is missing. Using Actions secret TAURI_SIGNING_PRIVATE_KEY."
          } else {
            Write-Error "No updater signing key. Expected signing/articlebook.key or secret TAURI_SIGNING_PRIVATE_KEY."
            exit 1
          }
          npm run tauri -- build --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Cargo workspace output is <repo>/target, not src-tauri/target.
          $nsis = Join-Path $env:GITHUB_WORKSPACE "target\release\bundle\nsis"
          Write-Host "NSIS bundle directory: $nsis"
          if (-not (Test-Path -LiteralPath $nsis)) {
            Write-Host "Installer search under target and src-tauri\target:"
            foreach ($root in @("target", "src-tauri\target")) {
              $dir = Join-Path $env:GITHUB_WORKSPACE $root
              if (Test-Path -LiteralPath $dir) {
                Get-ChildItem -Recurse -File -LiteralPath $dir -ErrorAction SilentlyContinue |
                  Where-Object { $_.Extension -in ".exe", ".sig", ".json", ".zip" } |
                  ForEach-Object { Write-Host $_.FullName }
              }
            }
            Write-Error "Build did not create $nsis."
            exit 1
          }
          Get-ChildItem -Force -LiteralPath $nsis | ForEach-Object { Write-Host ("{0}`t{1}" -f $_.Length, $_.Name) }
          $exes = @(Get-ChildItem -LiteralPath $nsis -File | Where-Object { $_.Extension -eq ".exe" })
          if ($exes.Count -lt 1) {
            Write-Error "No NSIS .exe in $nsis."
            exit 1
          }
          $missing = @($exes | Where-Object { -not (Test-Path -LiteralPath ($_.FullName + ".sig")) })
          if ($missing.Count -gt 0) {
            Write-Error ("Updater signature missing for: " + ($missing.Name -join ", ") + ". createUpdaterArtifacts is enabled, but no .sig was written.")
            exit 1
          }

      - name: Write updater latest.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: node .github/scripts/write-latest-json.mjs

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: articlebook-windows
          if-no-files-found: error
          path: target/release/bundle/nsis/*

      - name: Draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: target/release/bundle/nsis/*
