[package]
name = "articlebook"
version = "0.1.1"
description = "Personal desktop archive for web and WeChat articles"
authors = ["ArticleBook"]
edition = "2021"
publish = false

[lib]
name = "articlebook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
articlebook-engine = { path = "../crates/articlebook-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.14.1"
