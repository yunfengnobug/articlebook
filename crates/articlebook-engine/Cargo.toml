[package]
name = "articlebook-engine"
version = "0.1.0"
description = "Local engine that turns article URLs into Markdown and EPUB"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "5"
encoding_rs = "0.8"
hex = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "http2", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["ansi", "fmt", "std"] }
url = "2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[[bin]]
name = "articlebook-cli"
path = "src/bin/articlebook.rs"
